<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer glowing biometric scan circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="8" stroke-dasharray="24 16" opacity="0.6"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#6366f1" stroke-width="4" opacity="0.4"/>
  
  <!-- Shield Emblem -->
  <path d="M 256 120 L 360 168 C 360 280 256 368 256 368 C 256 368 152 280 152 168 Z" fill="rgba(255, 255, 255, 0.08)" stroke="url(#accent)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Center Face Silhouette & Checkmark -->
  <!-- Forehead / Face Contour -->
  <path d="M 206 230 C 206 195 230 174 256 174 C 282 174 306 195 306 230 C 306 268 286 290 256 304 C 226 290 206 268 206 230 Z" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Biometric Reticle Target Corners -->
  <path d="M 176 190 L 176 170 L 196 170" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 336 190 L 336 170 L 316 170" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 176 290 L 176 310 L 196 310" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 336 290 L 336 310 L 316 310" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Verified Core Checkmark -->
  <path d="M 230 250 L 248 268 L 284 228" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Brand Typography Badge: OB HR -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">ONEBRIDGE HR</text>
</svg>
